[Wind]
Enabled=1
; Open Shaders normalized velocity -> Skyrim units/s (GPUSMPPhysicsNG scaling).
Strength=6.0
MaxSpeed=900.0
; Global acceleration cap for ALL FSMP bones (hair, clothing, banners, etc.).
; Matches GPUSMPPhysicsNG HairWind's original mass * 400 force limit.
; 0 disables base wind drag; 400 retains original behavior.
MaxWindAcceleration=400.0
; GPUSMPPhysicsNG parity: exclude impulses tagged as native Havok physics.
; HeavyImpact (Wind-tagged) transients are still included.
IncludeNativeHavokImpulses=0
; Three LOS Havok rays per probe, independent ambient/transient components.
; 1/3/5 bone probes selected based on the system's longest world dimension.
EnableWorldShelter=1
; World-space bone extent (Skyrim units) triggering 3 / 5 shelter probes.
; Bone positions closest to 20/50/80% or 10/30/50/70/90% are chosen.
ShelterThreePointDistance=300.0
ShelterFivePointDistance=900.0
; Native FSMP-style linear distance weighting per obstructed ray:
; obstruction is full at <=50 units, fades to zero by 2000 units.
; The very close center ray (<=50) still fully shelters the system point.
ShelterNoWindDistance=50.0
ShelterMaxWindDistance=2000.0
; Missing LOS/ownership queries do not imply a blocking wall: exposure
; defaults to 1.0 and existing measurements smoothly return to 1.0.
; Invalid FSMP bone ownership still fails closed and receives no wind.
; Same 0.5-second base cadence as GPUSMPPhysicsNG. Staggered per system.
ShelterIntervalSeconds=0.5
; Independent GPU SMP-style self-shelter. Tests up to 8 dynamic bones per
; validated actor system against actor-owned Havok collision and posed head,
; neck, torso, and shoulder approximations. Does not read private FSMP shapes.
EnableSelfShelter=1
SelfShelterReach=150.0
; Shelter attenuates FORCE (pre acceleration cap), not wind velocity.
; Separate ambient/transient shelter ratios are retained.
; Immediate *request* on transient onset or large direction/strength change.
; Small residual transients below this normalized magnitude are ignored.
TransientThreshold=0.02
; Expensive weighted NIF area inventory is separate from shelter probes.
GeometryRescanSeconds=3.0
; GPU SMP parity: valid actor bones without readable skinned triangles use an
; estimated segment length x DefaultSegmentWidth, clamped to sane widths.
; Only system-owned, node-verified bones qualify. Set 0 for strict NIF-only.
AllowUnmeasuredAreaFallback=1
; Non-actor world SMP objects may lack skin data: approximate area from bones.
AllowUnmeasuredWorldAreaFallback=1
DefaultSegmentWidth=3.0
MaxBoneNodeDistance=180.0
LogEveryNFrames=0

; Per-bone diagnostic: requested force versus actual change in Bullet's
; getTotalForce() immediately after applyCentralForce(), during FSMP PreStep.
; Enabled by default; disable to avoid logging/per-step diagnostic reads.
LogBoneForces=0
; Log once per N FSMP physics steps. This is separate from LogEveryNFrames.
BoneForceLogEveryNFrames=600
; Show the strongest N accumulated bone forces per diagnostic step.
; 0 = log ALL evaluated bones (can be hundreds of lines at once).
BoneForceLogMaxEntries=64

; One diagnostic per system missing all measured area; identifies strict
; skin-node mismatches versus inaccessible CPU triangle data.
LogMissingAreaDiagnostics=0
